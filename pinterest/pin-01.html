<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blank Template</title>
  <style>
    /* Document Setup & Modern Box Model */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Core Typography & Base Styling */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: #333333;
      background-color: #fcfcfc;
      padding: 2rem 1rem;
    }

    /* Center Page Container */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }

    /* Simple Layout Headings */
    h1, h2, h3 {
      color: #111111;
      margin-bottom: 1rem;
      font-weight: 700;
    }

    p {
      margin-bottom: 1.5rem;
    }

    /* Utility Button Component */
    .btn {
      display: inline-block;
      background-color: #0066cc;
      color: #ffffff;
      padding: 0.75rem 1.5rem;
      text-decoration: none;
      border-radius: 4px;
      font-weight: 500;
      transition: background 0.2s ease;
    }

    .btn:hover {
      background-color: #0052a3;
    }
  </style>
</head>
<body>

  <main class="container">
  <h2>
    Feynman O-ring Demonstration
  </h2>
  <hr style="width: 100%; margin: 20px auto; border: 2px solid purple;">
<div style="display: flex; justify-content: center;">
<iframe width="560" height="315" src="https://www.youtube.com/embed/8qAi_9quzUY?si=d0XSbotW5lDaMes1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</div>
<hr style="width: 100%; margin: 20px auto; border: 2px solid purple;">
<h2>Moon Landing</h2>
<h3>One small step</h3>

<style>
  .graphics-grid {
  display: grid; /* Activates the grid layout context */
  /* Creates columns that automatically fit the space, each at least 250px wide */
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
  gap: 16px; /* Sets a clean spacing/gutter between images */
  padding: 16px;
}

.grid-item img {
  width: 100%; /* Forces images to fill the grid item width */
  height: 500px; /* Sets a uniform height for consistency */
  object-fit: cover; /* Crops the image gracefully to fit the aspect ratio */
  border-radius: 8px; /* Optional aesthetics */
}
</style>
<div class="graphics-grid">
<div class="grid-item"> <img src="higgs01.jpg" width=100px;></div>
<div class="grid-item"> <img src="higgs02.jpg" width=100px;></div>

</div>

</main>

</body>
</html>
